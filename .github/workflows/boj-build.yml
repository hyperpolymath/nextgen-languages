name: BoJ Server Build Trigger
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  trigger-boj:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Trigger BoJ Server (Casket/ssg-mcp)
        env:
          BOJ_REPOSITORY: ${{ github.repository }}
          BOJ_BRANCH: ${{ github.ref_name }}
        run: |
          jq -n --arg repo "$BOJ_REPOSITORY" --arg branch "$BOJ_BRANCH" \
            '{repo: $repo, branch: $branch, engine: "casket"}' |
            curl --fail-with-body --silent --show-error --connect-timeout 5 --max-time 30 \
              -H 'Content-Type: application/json' --data-binary @- \
              http://boj-server.local:7700/cartridges/ssg-mcp/invoke
        continue-on-error: true
permissions:
  contents: read
